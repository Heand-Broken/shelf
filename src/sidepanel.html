<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shelf</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Shelf</span>
        </div>
        <div class="topbar-actions">
          <button id="btn-save" class="btn btn-primary" type="button" title="Save this page (Alt+S)">Save page</button>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-view="shelf" role="tab" type="button">Shelf</button>
        <button class="tab" data-view="reader" role="tab" type="button" disabled>Read</button>
        <button class="tab" data-view="settings" role="tab" type="button">Settings</button>
      </nav>

      <main id="main" class="main" role="tabpanel"></main>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
